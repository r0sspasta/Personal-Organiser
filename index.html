    });
    list.querySelectorAll("[data-sub-remove]").forEach(btn => {
      btn.addEventListener("click", () => { removeSubtask(t.id, btn.dataset.subRemove); renderEditSubtasks(state.tasks.find(x => x.id === t.id)); });
    });
  }

  function openEditSheet(id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    state.editingId = id;
    modalRoot.innerHTML = `
      <div class="sheet-backdrop" id="editBackdrop">
        <div class="sheet">
          <button class="icon-btn close-x" id="editClose">✕</button>
          <h2>Edit task</h2>
          <div class="sheet-row">
            <label>Text</label>
            <textarea id="editText" rows="2">${escapeHtml(t.text)}</textarea>
          </div>
          <div class="sheet-row">
            <label>Category</label>
            <div class="segmented" id="editCategory">
              ${state.categories.map(c => `<button data-v="${c.id}" class="${t.category === c.id ? "on" : ""}">${c.icon} ${escapeHtml(c.label)}</button>`).join("")}
            </div>
          </div>
          <div class="sheet-row">
            <label>Priority</label>
            <div class="segmented" id="editPriority">
              <button data-v="low" class="${t.priority === "low" ? "on" : ""}">Low</button>
              <button data-v="medium" class="${t.priority === "medium" ? "on" : ""}">Medium</button>
              <button data-v="high" class="${t.priority === "high" ? "on" : ""}">High</button>
            </div>
          </div>
          <div class="sheet-row">
            <label>Due date & time</label>
            <input type="datetime-local" id="editDue" value="${toLocalInputValue(t.dueAt)}" />
          </div>
          <div class="sheet-row">
            <label>Repeat</label>
            <select id="editRepeat">
              <option value="" ${!t.repeat ? "selected" : ""}>Doesn't repeat</option>
              <option value="daily" ${t.repeat === "daily" ? "selected" : ""}>Daily</option>
              <option value="weekly" ${t.repeat === "weekly" ? "selected" : ""}>Weekly</option>
              <option value="monthly" ${t.repeat === "monthly" ? "selected" : ""}>Monthly</option>
            </select>
          </div>
          <div class="sheet-row">
            <label>Steps</label>
            <div id="editSubtaskList"></div>
            <div class="subtask-add-row">
              <input type="text" id="editSubtaskInput" placeholder="Add a step…" />
              <button id="editSubtaskAdd" aria-label="Add step">+</button>
            </div>
          </div>
          <div class="sheet-actions">
            <button class="btn danger-outline" id="editDelete">Delete</button>
            <button class="btn primary" id="editSave">Save</button>
          </div>
        </div>
      </div>`;

    renderEditSubtasks(t);
    document.getElementById("editSubtaskAdd").addEventListener("click", () => {
      const input = document.getElementById("editSubtaskInput");
      if (input.value.trim()) { addSubtask(t.id, input.value); input.value = ""; renderEditSubtasks(state.tasks.find(x => x.id === t.id)); }
    });
    document.getElementById("editSubtaskInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); document.getElementById("editSubtaskAdd").click(); }
    });

    const backdrop = document.getElementById("editBackdrop");
    let catSel = t.category, prioSel = t.priority;
    document.getElementById("editCategory").querySelectorAll("button").forEach(b => {
      b.addEventListener("click", () => {
        catSel = b.dataset.v;
        b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      });
    });
    document.getElementById("editPriority").querySelectorAll("button").forEach(b => {
      b.addEventListener("click", () => {
        prioSel = b.dataset.v;
        b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      });
    });
    document.getElementById("editClose").addEventListener("click", closeSheet);
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeSheet(); });
    document.getElementById("editDelete").addEventListener("click", () => {
      if (confirm("Delete this task?")) { deleteTask(id); closeSheet(); }
    });
    document.getElementById("editSave").addEventListener("click", () => {
      const dueVal = document.getElementById("editDue").value;
      updateTask(id, {
        text: document.getElementById("editText").value.trim() || t.text,
        category: catSel,
        priority: prioSel,
        dueAt: dueVal ? new Date(dueVal).toISOString() : null,
        repeat: document.getElementById("editRepeat").value || null,
      });
      closeSheet();
    });
  }

  function closeSheet() { modalRoot.innerHTML = ""; state.editingId = null; }

  /* ---------------------------------------------------------------- */
  /* Category management sheet                                         */
  /* ---------------------------------------------------------------- */
  function openCategoriesSheet() {
    modalRoot.innerHTML = `
      <div class="sheet-backdrop" id="catBackdrop">
        <div class="sheet">
          <button class="icon-btn close-x" id="catClose">✕</button>
          <h2>Categories</h2>
          <div id="catList"></div>
          <div class="sheet-actions">
            <button class="btn ghost" id="catAddBtn">+ Add category</button>
          </div>
        </div>
      </div>`;
    renderCatList();
    document.getElementById("catClose").addEventListener("click", () => { closeSheet(); openSettingsSheet(); });
    document.getElementById("catBackdrop").addEventListener("click", (e) => { if (e.target === e.currentTarget) { closeSheet(); openSettingsSheet(); } });
    document.getElementById("catAddBtn").addEventListener("click", () => openCategoryEditor(null));
  }

  function renderCatList() {
    const list = document.getElementById("catList");
    list.innerHTML = state.categories.map((c, i) => `
      <div class="cat-manage-row">
        <div class="cat-preview">
          <span class="cat-dot" style="${catStyleAttr(c)}">${c.icon}</span>
          <span>${escapeHtml(c.label)}</span>
        </div>
        <button class="mini-btn" data-up="${c.id}" title="Move up" ${i === 0 ? "disabled style='opacity:.3'" : ""}>▲</button>
        <button class="mini-btn" data-down="${c.id}" title="Move down" ${i === state.categories.length - 1 ? "disabled style='opacity:.3'" : ""}>▼</button>
        <button class="mini-btn" data-edit-cat="${c.id}" title="Edit">✏️</button>
        <button class="mini-btn" data-del-cat="${c.id}" title="Delete" ${state.categories.length <= 1 ? "disabled style='opacity:.3'" : ""}>🗑️</button>
      </div>`).join("");
    list.querySelectorAll("[data-up]").forEach(b => b.addEventListener("click", () => moveCategory(b.dataset.up, -1)));
    list.querySelectorAll("[data-down]").forEach(b => b.addEventListener("click", () => moveCategory(b.dataset.down, 1)));
    list.querySelectorAll("[data-edit-cat]").forEach(b => b.addEventListener("click", () => openCategoryEditor(b.dataset.editCat)));
    list.querySelectorAll("[data-del-cat]").forEach(b => b.addEventListener("click", () => deleteCategory(b.dataset.delCat)));
  }

  function moveCategory(id, dir) {
    const i = state.categories.findIndex(c => c.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= state.categories.length) return;
    const arr = state.categories;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    saveCategories();
    renderCatList();
  }

  function deleteCategory(id) {
    if (state.categories.length <= 1) return;
    const affected = state.tasks.filter(t => t.category === id).length;
    const msg = affected
      ? `${affected} task(s) use this category — they'll show as "Unlabeled" instead. Delete anyway?`
      : "Delete this category?";
    if (!confirm(msg)) return;
    state.categories = state.categories.filter(c => c.id !== id);
    saveCategories();
    renderCatList();
    renderCurrentScreen();
  }

  function openCategoryEditor(id) {
    const isNew = !id;
    const existing = isNew ? null : catById(id);
    let label = existing ? existing.label : "";
    let icon = existing ? existing.icon : EMOJI_SUGGESTIONS[state.categories.length % EMOJI_SUGGESTIONS.length];
    let color = existing ? existing.color : COLOR_SWATCHES[state.categories.length % COLOR_SWATCHES.length];

    modalRoot.innerHTML = `
      <div class="sheet-backdrop" id="ceBackdrop">
        <div class="sheet">
          <button class="icon-btn close-x" id="ceClose">✕</button>
          <h2>${isNew ? "New category" : "Edit category"}</h2>
          <div class="sheet-row">
            <label>Name</label>
            <input type="text" id="ceLabel" value="${escapeHtml(label)}" placeholder="e.g. Travel" maxlength="20" />
          </div>
          <div class="sheet-row">
            <label>Icon</label>
            <input type="text" id="ceIcon" value="${icon}" maxlength="4" style="width:64px;text-align:center;font-size:20px;" />
            <div class="emoji-grid" id="ceEmojiGrid"></div>
          </div>
          <div class="sheet-row">
            <label>Color</label>
            <div class="swatch-grid" id="ceSwatchGrid"></div>
          </div>
          <div class="sheet-actions">
            <button class="btn primary" id="ceSave">${isNew ? "Add category" : "Save"}</button>
          </div>
        </div>
      </div>`;

    document.getElementById("ceEmojiGrid").innerHTML = EMOJI_SUGGESTIONS.map(e => `<button data-emoji="${e}">${e}</button>`).join("");
    document.getElementById("ceEmojiGrid").querySelectorAll("button").forEach(b => {
      b.addEventListener("click", () => { document.getElementById("ceIcon").value = b.dataset.emoji; icon = b.dataset.emoji; });
    });
    const swatchGrid = document.getElementById("ceSwatchGrid");
    function renderSwatches() {
      swatchGrid.innerHTML = COLOR_SWATCHES.map(hex => `<button class="swatch ${hex === color ? "on" : ""}" data-hex="${hex}" style="background:${hex}"></button>`).join("");
      swatchGrid.querySelectorAll(".swatch").forEach(b => b.addEventListener("click", () => { color = b.dataset.hex; renderSwatches(); }));
    }
    renderSwatches();

    document.getElementById("ceClose").addEventListener("click", () => openCategoriesSheet());
    document.getElementById("ceBackdrop").addEventListener("click", (e) => { if (e.target === e.currentTarget) openCategoriesSheet(); });
    document.getElementById("ceSave").addEventListener("click", () => {
      label = document.getElementById("ceLabel").value.trim();
      icon = document.getElementById("ceIcon").value.trim() || icon;
      if (!label) { showToast("Give the category a name"); return; }
      if (isNew) {
        if (state.categories.length >= MAX_CATEGORIES) { showToast(`Max ${MAX_CATEGORIES} categories`); return; }
        state.categories.push({ id: uid(), icon, label, color });
      } else {
        Object.assign(existing, { icon, label, color });
      }
      saveCategories();
      openCategoriesSheet();
      renderCurrentScreen();
    });
  }

  /* ---------------------------------------------------------------- */
  /* Settings sheet                                                     */
  /* ---------------------------------------------------------------- */
  function syncStatusDot() {
    if (!state.settings.syncEnabled) return `<span class="status-dot off"></span>Off`;
    if (syncState.status === "ok") return `<span class="status-dot ok"></span>Synced`;
    if (syncState.status === "pending") return `<span class="status-dot pending"></span>Syncing…`;
    if (syncState.status === "err") return `<span class="status-dot err"></span>Failed`;
    return `<span class="status-dot off"></span>Not yet synced`;
  }
  function pushStatusDot() {
    if (!state.settings.pushEnabled) return `<span class="status-dot off"></span>Off`;
    if (pushState.status === "ok") return `<span class="status-dot ok"></span>Subscribed`;
    if (pushState.status === "err") return `<span class="status-dot err"></span>Failed`;
    return `<span class="status-dot pending"></span>Pending`;
  }

  function openSettingsSheet() {
    modalRoot.innerHTML = `
      <div class="sheet-backdrop" id="setBackdrop">
        <div class="sheet">
          <button class="icon-btn close-x" id="setClose">✕</button>
          <h2>Settings</h2>

          <div class="settings-group">
            <h3>Categories</h3>
            <div class="settings-row">
              <div>
                <div class="label">${state.categories.length} categories</div>
                <div class="sub">Rename, recolor, reorder, add, or remove — up to ${MAX_CATEGORIES}</div>
              </div>
              <button class="btn ghost sm" id="btnManageCats" style="width:auto;padding:8px 14px;">Manage</button>
            </div>
          </div>

          <div class="settings-group">
            <h3>Notifications</h3>
            <div class="settings-row">
              <div>
                <div class="label">Due-item reminders</div>
                <div class="sub">Browser notifications while the app is open</div>
              </div>
              <div class="switch ${state.settings.notifyEnabled ? "on" : ""}" id="notifySwitch" role="switch" tabindex="0" aria-checked="${state.settings.notifyEnabled}"><div class="knob"></div></div>
            </div>
            <div class="settings-row">
              <div>
                <div class="label">Background reminders (push)</div>
                <div class="sub">${pushStatusDot()} — fires even with the app closed. Needs a Push Worker URL below.</div>
              </div>
              <div class="switch ${state.settings.pushEnabled ? "on" : ""}" id="pushSwitch" role="switch" tabindex="0" aria-checked="${state.settings.pushEnabled}"><div class="knob"></div></div>
            </div>
            <div class="sheet-row" style="margin-top:10px;">
              <label>Push Worker URL</label>
              <input type="text" id="pushUrlInput" placeholder="https://organiser-push.you.workers.dev" value="${escapeHtml(state.settings.pushWorkerUrl || "")}" />
            </div>
            <div class="sub" style="margin-top:2px;">Reminders arrive as a generic "task due" notification (no title text) — tap it to open the app. See README for the one-time Cloudflare Worker setup.</div>
          </div>

          <div class="settings-group">
            <h3>Google Sheets backup</h3>
            <div class="settings-row">
              <div>
                <div class="label">Sync enabled</div>
                <div class="sub">${syncStatusDot()}</div>
              </div>
              <div class="switch ${state.settings.syncEnabled ? "on" : ""}" id="syncSwitch" role="switch" tabindex="0" aria-checked="${state.settings.syncEnabled}"><div class="knob"></div></div>
            </div>
            <div class="sheet-row" style="margin-top:10px;">
              <label>Apps Script Web App URL</label>
              <input type="text" id="sheetsUrlInput" placeholder="https://script.google.com/macros/s/.../exec" value="${escapeHtml(state.settings.sheetsUrl || "")}" />
            </div>
            <div class="sheet-actions">
              <button class="btn ghost" id="testSyncBtn">Save & test</button>
            </div>
            <div class="sub" style="margin-top:8px;">See README for the 3-minute setup.</div>
          </div>

          <div class="settings-group">
            <h3>Data</h3>
            <div class="sheet-actions">
              <button class="btn ghost" id="exportBtn">Export JSON</button>
              <button class="btn ghost" id="importBtn">Import JSON</button>
            </div>
            <input type="file" id="importFile" accept="application/json" class="hidden" />
          </div>

          <div class="settings-group">
            <h3>About</h3>
            <div class="sub">${state.tasks.length} tasks stored on this device (${totalOpenCount()} open). "Stuck" flag triggers after ${state.settings.staleDays} days untouched.</div>
          </div>
        </div>
      </div>`;

    const backdrop = document.getElementById("setBackdrop");
    document.getElementById("setClose").addEventListener("click", closeSheet);
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeSheet(); });
    document.getElementById("btnManageCats").addEventListener("click", openCategoriesSheet);

    document.getElementById("notifySwitch").addEventListener("click", async () => {
      if (!state.settings.notifyEnabled) {
        const perm = await requestNotifyPermission();
        state.settings.notifyEnabled = perm === "granted";
        if (perm !== "granted") showToast("Notifications blocked in browser settings");
      } else {
        state.settings.notifyEnabled = false;
      }
      saveSettings();
      openSettingsSheet();
    });

    document.getElementById("pushSwitch").addEventListener("click", async () => {
      if (!state.settings.pushEnabled) {
        state.settings.pushWorkerUrl = document.getElementById("pushUrlInput").value.trim();
        if (!state.settings.pushWorkerUrl) { showToast("Add your Push Worker URL first"); return; }
        await enablePush();
      } else {
        await disablePush();
      }
      saveSettings();
      openSettingsSheet();
    });

    document.getElementById("syncSwitch").addEventListener("click", () => {
      state.settings.syncEnabled = !state.settings.syncEnabled;
      saveSettings();
      if (state.settings.syncEnabled) scheduleSync();
      openSettingsSheet();
    });

    document.getElementById("testSyncBtn").addEventListener("click", () => {
      state.settings.sheetsUrl = document.getElementById("sheetsUrlInput").value.trim();
      state.settings.syncEnabled = !!state.settings.sheetsUrl;
      saveSettings();
      runSync(true);
      openSettingsSheet();
    });

    document.getElementById("exportBtn").addEventListener("click", exportJson);
    document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
    document.getElementById("importFile").addEventListener("change", importJson);
  }

  /* ---------------------------------------------------------------- */
  /* Export / Import                                                    */
  /* ---------------------------------------------------------------- */
  function exportJson() {
    const data = { tasks: state.tasks, categories: state.categories, settings: { staleDays: state.settings.staleDays }, exportedAt: nowISO() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "organiser-backup-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast("Exported backup");
  }

  function importJson(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.tasks)) throw new Error("bad file");
        if (confirm(`Import ${data.tasks.length} tasks? This replaces everything currently stored.`)) {
          state.tasks = data.tasks;
          if (Array.isArray(data.categories) && data.categories.length) { state.categories = data.categories; saveCategories(); }
          saveTasks();
          closeSheet();
          renderCurrentScreen();
          showToast("Import complete");
        }
      } catch (err) {
        alert("Couldn't read that file — is it an Organiser export?");
      }
    };
    reader.readAsText(file);
  }

  /* ---------------------------------------------------------------- */
  /* Notifications (foreground)                                          */
  /* ---------------------------------------------------------------- */
  async function requestNotifyPermission() {
    if (!("Notification" in window)) return "unsupported";
    if (Notification.permission === "granted") return "granted";
    return await Notification.requestPermission();
  }

  function loadNotified() {
    try { return new Set(JSON.parse(localStorage.getItem(NOTIFIED_KEY)) || []); }
    catch (e) { return new Set(); }
  }
  function saveNotified(set) {
    try { localStorage.setItem(NOTIFIED_KEY, JSON.stringify(Array.from(set))); } catch (e) {}
  }
  let notified = loadNotified();

  function checkDueNotifications() {
    if (!state.settings.notifyEnabled || !("Notification" in window) || Notification.permission !== "granted") return;
    const now = new Date();
    state.tasks.forEach(t => {
      if (t.completedAt || !t.dueAt || notified.has(t.id)) return;
      const due = new Date(t.dueAt);
      if (due <= now) {
        try {
          new Notification("Due: " + t.text, { body: catById(t.category).label + " task", icon: "icons/icon-192.png" });
        } catch (e) {}
        notified.add(t.id);
        saveNotified(notified);
      }
    });
  }
  setInterval(checkDueNotifications, 60000);

  /* ---------------------------------------------------------------- */
  /* Background push (real notifications when the app is closed)       */
  /* ---------------------------------------------------------------- */
  const VAPID_PUBLIC_KEY = "BM-9SdWcnzlv-WkodxW52gJuzlqQGhe7mv5h32M36buC1OV_cdzPBmRZX7RU90xQm_kubP7PMBa2GRThDKdKP_M";
  const pushState = { status: "off" };

  function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const raw = atob(base64);
    const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }

  async function enablePush() {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
      showToast("Push isn't supported in this browser");
      return;
    }
    try {
      const perm = await requestNotifyPermission();
      if (perm !== "granted") { showToast("Notifications blocked in browser settings"); return; }
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
      }
      const res = await fetch(state.settings.pushWorkerUrl.replace(/\/$/, "") + "/subscribe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ deviceId: getDeviceId(), subscription: sub.toJSON ? sub.toJSON() : sub }),
      });
      if (!res.ok) throw new Error("subscribe failed");
      state.settings.pushEnabled = true;
      pushState.status = "ok";
      showToast("Background reminders on ✓");
      syncPushTasks();
    } catch (e) {
      pushState.status = "err";
      state.settings.pushEnabled = false;
      showToast("Couldn't enable push — check the Worker URL");
    }
  }

  async function disablePush() {
    try {
      if ("serviceWorker" in navigator) {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if (sub) await sub.unsubscribe();
      }
      if (state.settings.pushWorkerUrl) {
        fetch(state.settings.pushWorkerUrl.replace(/\/$/, "") + "/unsubscribe", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ deviceId: getDeviceId() }),
        }).catch(() => {});
      }
    } catch (e) {}
    state.settings.pushEnabled = false;
    pushState.status = "off";
  }

  let pushSyncTimer = null;
  function schedulePushSync() {
    if (!state.settings.pushEnabled || !state.settings.pushWorkerUrl) return;
    if (pushSyncTimer) clearTimeout(pushSyncTimer);
    pushSyncTimer = setTimeout(syncPushTasks, 4000);
  }
  function syncPushTasks() {
    if (!state.settings.pushEnabled || !state.settings.pushWorkerUrl) return;
    const minimal = state.tasks.filter(t => !t.completedAt && t.dueAt).map(t => ({ id: t.id, text: t.text, category: t.category, dueAt: t.dueAt }));
    fetch(state.settings.pushWorkerUrl.replace(/\/$/, "") + "/sync", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ deviceId: getDeviceId(), tasks: minimal }),
    }).catch(() => {});
  }

  /* ---------------------------------------------------------------- */
  /* Google Sheets one-way sync                                        */
  /* ---------------------------------------------------------------- */
  const syncState = { status: "off", timer: null };

  function scheduleSync() {
    if (!state.settings.syncEnabled || !state.settings.sheetsUrl) return;
    if (syncState.timer) clearTimeout(syncState.timer);
    syncState.timer = setTimeout(() => runSync(false), 4000);
  }

  function runSync(manual) {
    if (!state.settings.sheetsUrl) { if (manual) showToast("Add a Sheets URL first"); return; }
    syncState.status = "pending";
    fetch(state.settings.sheetsUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ tasks: state.tasks, syncedAt: nowISO() }),
    }).then(() => {
      syncState.status = "ok";
      if (manual) showToast("Sheet sync connected ✓");
    }).catch(() => {
      syncState.status = "err";
      if (manual) showToast("Sync failed — check the URL");
    });
  }

  /* ---------------------------------------------------------------- */
  /* Toast                                                              */
  /* ---------------------------------------------------------------- */
  const toastEl = document.getElementById("toast");
  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  /* ---------------------------------------------------------------- */
  /* Service worker                                                     */
  /* ---------------------------------------------------------------- */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  /* ---------------------------------------------------------------- */
  /* Boot                                                                */
  /* ---------------------------------------------------------------- */
  state.captureCategory = state.categories[0] ? state.categories[0].id : null;
  show();
  if (state.settings.notifyEnabled && "Notification" in window && Notification.permission === "granted") {
    checkDueNotifications();
  }
})();
</script>
</body>
</html>
