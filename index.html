<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Personal Organiser</title>
<meta name="description" content="Capture work and personal to-dos by voice or text, and track them on a dashboard." />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#4f46e5" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<style>
  :root {
    --bg: #0b0d14;
    --bg-elev: #12151f;
    --bg-elev-2: #1a1e2b;
    --border: #262b3a;
    --text: #eef0f6;
    --text-dim: #9aa0b4;
    --text-faint: #6b7186;
    --accent: #6366f1;
    --accent-dim: #4f46e5;
    --accent-soft: rgba(99, 102, 241, 0.16);
    --work: #38bdf8;
    --work-soft: rgba(56, 189, 248, 0.14);
    --personal: #34d399;
    --personal-soft: rgba(52, 211, 153, 0.14);
    --home-cat: #fb923c;
    --home-cat-soft: rgba(251, 146, 60, 0.14);
    --other: #a78bfa;
    --other-soft: rgba(167, 139, 250, 0.14);
    --gaming: #f472b6;
    --gaming-soft: rgba(244, 114, 182, 0.14);
    --danger: #f87171;
    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, 0.14);
    --radius: 14px;
    --radius-sm: 9px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  button { font-family: inherit; }
  .screen.hidden { display: none !important; }
  .hidden { display: none !important; }
  a { color: #a5a8ff; }

  /* ================= Shared bits ================= */
  .icon-btn {
    background: var(--bg-elev-2); border: 1px solid var(--border); color: var(--text-dim);
    width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; font-size: 16px; flex-shrink: 0;
  }
  .icon-btn:active { transform: scale(0.94); }
  .check:focus-visible, .icon-btn:focus-visible, .mini-btn:focus-visible, .cat-btn:focus-visible,
  .tab:focus-visible, .chip:focus-visible, .round-btn:focus-visible, .btn:focus-visible,
  .segmented button:focus-visible, .switch:focus-visible, .tile:focus-visible,
  .home-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ================= Home / landing screen ================= */
  #homeScreen { min-height: 100vh; display: flex; flex-direction: column; }
  .home-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 20px) 0 4px;
  }
  .home-header .brand { display: flex; align-items: center; gap: 9px; }
  .home-header .brand-mark {
    width: 28px; height: 28px; border-radius: 8px; background: var(--accent-dim);
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .home-header h1 { font-size: 16px; margin: 0; font-weight: 700; color: var(--text-dim); }
  .home-header .home-actions { display: flex; gap: 8px; }

  .home-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 18px 0 28px; }
  .home-prompt {
    text-align: center; font-size: 20px; font-weight: 800; letter-spacing: -0.01em;
    margin: 0 0 4px; text-wrap: balance;
  }
  .home-sub { text-align: center; font-size: 13px; color: var(--text-faint); margin: 0 0 22px; }

  .tile-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    max-width: 420px; margin: 0 auto; width: 100%;
  }
  .tile {
    aspect-ratio: 1; border-radius: 22px; border: 1px solid var(--border); background: var(--bg-elev);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent;
    transition: transform .1s;
  }
  .tile:active { transform: scale(0.95); }
  .tile .tile-icon { font-size: 42px; line-height: 1; }
  .tile .tile-label { font-size: 15px; font-weight: 800; }
  .tile.wide {
    grid-column: 1 / -1; aspect-ratio: auto; flex-direction: row; padding: 16px; gap: 14px;
  }
  .tile.wide .tile-icon { font-size: 30px; }
  .tile-badge {
    position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.09);
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .tile.cat-work { background: var(--work-soft); border-color: rgba(56,189,248,0.32); }
  .tile.cat-work .tile-icon, .tile.cat-work .tile-label { color: var(--work); }
  .tile.cat-personal { background: var(--personal-soft); border-color: rgba(52,211,153,0.32); }
  .tile.cat-personal .tile-icon, .tile.cat-personal .tile-label { color: var(--personal); }
  .tile.cat-home { background: var(--home-cat-soft); border-color: rgba(251,146,60,0.32); }
  .tile.cat-home .tile-icon, .tile.cat-home .tile-label { color: var(--home-cat); }
  .tile.cat-other { background: var(--other-soft); border-color: rgba(167,139,250,0.32); }
  .tile.cat-other .tile-icon, .tile.cat-other .tile-label { color: var(--other); }
  .tile.cat-gaming { background: var(--gaming-soft); border-color: rgba(244,114,182,0.32); }
  .tile.cat-gaming .tile-icon, .tile.cat-gaming .tile-label { color: var(--gaming); }

  .home-links { display: flex; justify-content: center; gap: 22px; margin-top: 26px; flex-wrap: wrap; }
  .home-link {
    background: none; border: none; color: var(--text-dim); font-size: 13px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 6px;
  }
  .home-link .n { color: var(--text); font-variant-numeric: tabular-nums; }

  /* ================= Capture screen ================= */
  #captureScreen { min-height: 100vh; display: flex; flex-direction: column; }
  .capture-header {
    display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 16px) 0 14px;
  }
  .capture-cat-chip {
    display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px;
    padding: 8px 16px; border-radius: 999px; flex: 1; justify-content: center;
  }
  .capture-cat-chip.cat-work { background: var(--work-soft); color: var(--work); }
  .capture-cat-chip.cat-personal { background: var(--personal-soft); color: var(--personal); }
  .capture-cat-chip.cat-home { background: var(--home-cat-soft); color: var(--home-cat); }
  .capture-cat-chip.cat-other { background: var(--other-soft); color: var(--other); }
  .capture-cat-chip.cat-gaming { background: var(--gaming-soft); color: var(--gaming); }

  .capture-input-row {
    display: flex; gap: 8px; align-items: center;
    background: var(--bg-elev-2); border: 1px solid var(--border); border-radius: 18px;
    padding: 8px 8px 8px 16px; margin-bottom: 8px;
  }
  .capture-input-row input {
    flex: 1; background: transparent; border: none; color: var(--text); font-size: 17px; outline: none;
    min-width: 0;
  }
  .capture-input-row input::placeholder { color: var(--text-faint); }
  .capture-parse-hint { font-size: 12px; color: var(--text-faint); padding: 0 8px; min-height: 16px; margin-bottom: 18px; }
  .capture-parse-hint b { color: var(--text-dim); font-weight: 600; }

  .just-added-label {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-faint); margin: 6px 2px 10px;
  }
  .added-row {
    display: flex; align-items: center; gap: 10px; background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 7px;
  }
  .added-row .ok { color: var(--personal); font-size: 15px; flex-shrink: 0; }
  .added-row .txt { flex: 1; font-size: 14px; min-width: 0; word-break: break-word; }
  .added-row .meta { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .added-row .undo {
    background: none; border: none; color: var(--text-faint); font-size: 13px; cursor: pointer; padding: 4px 6px;
    flex-shrink: 0;
  }
  .capture-empty { text-align: center; color: var(--text-faint); font-size: 13px; padding: 30px 10px; line-height: 1.6; }

  .capture-footer { margin-top: auto; padding: 16px 0 calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }

  /* ================= Buttons (shared) ================= */
  .round-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none; flex-shrink: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .mic-btn { background: var(--bg-elev); color: var(--text-dim); }
  .mic-btn.listening { background: var(--danger); color: white; animation: pulse 1.2s infinite; }
  .send-btn { background: var(--accent); color: white; }
  .send-btn:disabled { background: var(--bg-elev); color: var(--text-faint); }
  @media (prefers-reduced-motion: reduce) { .mic-btn.listening { animation: none; } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.5); } 50% { box-shadow: 0 0 0 8px rgba(248,113,113,0); } }

  .btn {
    padding: 13px 0; border-radius: 12px; border: none; font-size: 14.5px; font-weight: 700; cursor: pointer;
    width: 100%;
  }
  .btn.primary { background: var(--accent); color: white; }
  .btn.ghost { background: var(--bg-elev-2); color: var(--text-dim); border: 1px solid var(--border); }
  .btn.danger-outline { background: transparent; color: var(--danger); border: 1px solid rgba(248,113,113,0.4); }

  /* ================= Dashboard screen ================= */
  #dashboardScreen { padding-bottom: 40px; }
  header.top {
    padding: env(safe-area-inset-top) 0 0;
    position: sticky; top: 0; z-index: 30;
    background: linear-gradient(180deg, var(--bg) 70%, rgba(11,13,20,0.85));
    backdrop-filter: blur(8px);
  }
  .top-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0 8px; gap: 8px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px; background: var(--accent-dim);
    display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
  }
  .brand h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .top-row .home-actions { display: flex; gap: 8px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 6px; text-align: center; }
  .stat .n { font-size: 18px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }

  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim); cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .tab.active { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
  .tab .badge { background: rgba(255,255,255,0.08); border-radius: 999px; padding: 1px 6px; font-size: 11px; }

  .filters { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); color: var(--text-dim); background: transparent; white-space: nowrap;
  }
  .chip.active-all { background: rgba(255,255,255,0.08); color: var(--text); border-color: rgba(255,255,255,0.2); }
  .chip.active-work { background: var(--work-soft); color: var(--work); border-color: var(--work); }
  .chip.active-personal { background: var(--personal-soft); color: var(--personal); border-color: var(--personal); }
  .chip.active-home { background: var(--home-cat-soft); color: var(--home-cat); border-color: var(--home-cat); }
  .chip.active-other { background: var(--other-soft); color: var(--other); border-color: var(--other); }
  .chip.active-gaming { background: var(--gaming-soft); color: var(--gaming); border-color: var(--gaming); }

  main { padding-top: 4px; }
  .section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin: 18px 2px 8px; }
  .section-label:first-child { margin-top: 4px; }
  .empty { text-align: center; color: var(--text-faint); padding: 40px 20px; font-size: 14px; line-height: 1.6; }
  .empty .big { font-size: 32px; display: block; margin-bottom: 8px; }

  .card {
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 12px 11px; margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start;
    position: relative; overflow: hidden;
  }
  .card.overdue { border-color: rgba(248, 113, 113, 0.4); }
  .card.stale::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--warn); }
  .check {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--text-faint);
    flex-shrink: 0; margin-top: 1px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    background: transparent; color: transparent; font-size: 13px; transition: all .15s;
  }
  .check:active { transform: scale(0.9); }
  .card.done .check { background: var(--accent); border-color: var(--accent); color: white; }
  .card-body { flex: 1; min-width: 0; }
  .card-text { font-size: 14.5px; line-height: 1.4; word-break: break-word; }
  .card.done .card-text { color: var(--text-faint); text-decoration: line-through; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }
  .pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .pill.work { background: var(--work-soft); color: var(--work); }
  .pill.personal { background: var(--personal-soft); color: var(--personal); }
  .pill.home { background: var(--home-cat-soft); color: var(--home-cat); }
  .pill.other { background: var(--other-soft); color: var(--other); }
  .pill.gaming { background: var(--gaming-soft); color: var(--gaming); }
  .pill.due { background: rgba(255,255,255,0.07); color: var(--text-dim); }
  .pill.due.overdue-text { background: rgba(248, 113, 113, 0.15); color: var(--danger); }
  .pill.due.today-text { background: var(--accent-soft); color: #a5a8ff; }
  .pill.priority-high { background: rgba(248, 113, 113, 0.15); color: var(--danger); }
  .pill.repeat { background: rgba(255,255,255,0.07); color: var(--text-dim); }
  .pill.stale { background: var(--warn-soft); color: var(--warn); }
  .pill.tag { background: rgba(255,255,255,0.06); color: var(--text-faint); }
  .added-ts { font-size: 11px; color: var(--text-faint); margin-top: 5px; }

  .card-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .mini-btn {
    width: 28px; height: 28px; border-radius: 8px; border: none; background: transparent;
    color: var(--text-faint); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px;
  }
  .mini-btn:active { background: rgba(255,255,255,0.08); }

  .fab {
    position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 40;
    width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: white; border: none;
    font-size: 24px; box-shadow: 0 8px 24px rgba(79,70,229,0.45); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .fab:active { transform: scale(0.93); }

  /* ================= Modal / sheet (shared) ================= */
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet {
    background: var(--bg-elev); border-radius: 18px 18px 0 0; width: 100%; max-width: 640px;
    padding: 18px 18px calc(20px + env(safe-area-inset-bottom)); max-height: 85vh; overflow-y: auto;
    border-top: 1px solid var(--border);
  }
  .sheet h2 { margin: 0 0 14px; font-size: 16px; }
  .sheet-row { margin-bottom: 14px; }
  .sheet-row label { display: block; font-size: 12px; color: var(--text-faint); margin-bottom: 6px; font-weight: 600; }
  .sheet-row input[type=text], .sheet-row input[type=datetime-local], .sheet-row textarea, .sheet-row select {
    width: 100%; background: var(--bg-elev-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none;
  }
  .segmented { display: flex; gap: 6px; flex-wrap: wrap; }
  .segmented button {
    flex: 1; min-width: 68px; padding: 8px 0; border-radius: 9px; border: 1px solid var(--border); background: var(--bg-elev-2);
    color: var(--text-dim); font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .segmented button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
  .sheet-actions { display: flex; gap: 8px; margin-top: 6px; }
  .close-x { position: absolute; right: 14px; top: 14px; }

  .settings-group { margin-bottom: 20px; }
  .settings-group h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin: 0 0 10px; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .settings-row:last-child { border-bottom: none; }
  .settings-row .label { font-size: 14px; }
  .settings-row .sub { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
  .switch { width: 44px; height: 26px; border-radius: 999px; background: var(--bg-elev-2); border: 1px solid var(--border); position: relative; cursor: pointer; flex-shrink: 0; }
  .switch.on { background: var(--accent-dim); border-color: var(--accent); }
  .switch .knob { width: 20px; height: 20px; border-radius: 50%; background: white; position: absolute; top: 2px; left: 2px; transition: left .15s; }
  .switch.on .knob { left: 22px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-dot.ok { background: var(--personal); }
  .status-dot.pending { background: var(--warn); }
  .status-dot.err { background: var(--danger); }
  .status-dot.off { background: var(--text-faint); }

  .toast {
    position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    background: var(--bg-elev-2); border: 1px solid var(--border); color: var(--text); padding: 10px 16px;
    border-radius: 999px; font-size: 13px; z-index: 60; box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    display: flex; align-items: center; gap: 8px; opacity: 0; transition: opacity .2s, transform .2s;
    pointer-events: none; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
</style>
</head>
<body>

<!-- ============== HOME (landing) ============== -->
<div class="screen wrap" id="homeScreen">
  <div class="home-header">
    <div class="brand">
      <div class="brand-mark">✅</div>
      <h1>Organiser</h1>
    </div>
    <div class="home-actions">
      <button class="icon-btn" id="btnHomeSettings" title="Settings" aria-label="Settings">⚙️</button>
    </div>
  </div>
  <div class="home-body">
    <p class="home-prompt">What are you adding?</p>
    <p class="home-sub">Tap a category, then type or speak it.</p>
    <div class="tile-grid" id="tileGrid"></div>
    <div class="home-links">
      <button class="home-link" id="btnGoDashboard">📋 Dashboard <span class="n" id="homeOpenCount">0</span></button>
    </div>
  </div>
</div>

<!-- ============== CAPTURE ============== -->
<div class="screen wrap hidden" id="captureScreen">
  <div class="capture-header">
    <button class="icon-btn" id="btnCaptureBack" title="Home" aria-label="Back to home">⌂</button>
    <div class="capture-cat-chip" id="captureCatChip"></div>
  </div>
  <div class="capture-input-row">
    <input id="captureInput" type="text" placeholder="Type it… try &quot;call dentist tomorrow 3pm&quot;" autocomplete="off" />
    <button class="round-btn mic-btn" id="captureMicBtn" title="Voice input" aria-label="Voice input">🎤</button>
    <button class="round-btn send-btn" id="captureSendBtn" title="Add" aria-label="Add" disabled>➜</button>
  </div>
  <div class="capture-parse-hint" id="captureParseHint">&nbsp;</div>

  <div id="justAddedWrap"></div>

  <div class="capture-footer">
    <button class="btn ghost" id="btnCaptureViewList">View this list →</button>
    <button class="btn primary" id="btnCaptureDone">Done — back to Organiser</button>
  </div>
</div>

<!-- ============== DASHBOARD ============== -->
<div class="screen hidden" id="dashboardScreen">
  <div class="wrap">
    <header class="top">
      <div class="top-row">
        <div class="brand">
          <div class="brand-mark">✅</div>
          <h1>Organiser</h1>
        </div>
        <div class="home-actions">
          <button class="icon-btn" id="btnDashHome" title="Home" aria-label="Back to home">⌂</button>
          <button class="icon-btn" id="btnSettings" title="Settings" aria-label="Settings">⚙️</button>
        </div>
      </div>
      <div class="stats" id="statsRow"></div>
      <div class="tabs" id="tabsRow"></div>
      <div class="filters" id="filtersRow"></div>
    </header>

    <main id="mainList"></main>
  </div>
  <button class="fab" id="btnFabAdd" title="Add a task" aria-label="Add a task">+</button>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------- */
  /* Categories                                                         */
  /* ---------------------------------------------------------------- */
  const CATEGORY_META = {
    work:     { icon: "💼", label: "Work" },
    personal: { icon: "👤", label: "Personal" },
    home:     { icon: "🏠", label: "Home" },
    other:    { icon: "🗂️", label: "Other" },
    gaming:   { icon: "🎮", label: "Gaming" },
  };
  const CATEGORY_ORDER = ["work", "personal", "home", "other", "gaming"];
  const WIDE_TILES = ["gaming"]; // categories rendered as a full-width tile on the home grid

  /* ---------------------------------------------------------------- */
  /* Storage                                                           */
  /* ---------------------------------------------------------------- */
  const TASKS_KEY = "organiser.tasks.v1";
  const SETTINGS_KEY = "organiser.settings.v1";
  const NOTIFIED_KEY = "organiser.notified.v1";

  function loadTasks() {
    try { return JSON.parse(localStorage.getItem(TASKS_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveTasks() {
    try { localStorage.setItem(TASKS_KEY, JSON.stringify(state.tasks)); }
    catch (e) { /* storage full/unavailable */ }
    scheduleSync();
  }
  function loadSettings() {
    const defaults = {
      theme: "dark",
      sheetsUrl: "",
      syncEnabled: false,
      notifyEnabled: false,
      staleDays: 5,
    };
    try { return Object.assign(defaults, JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}); }
    catch (e) { return defaults; }
  }
  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings)); }
    catch (e) {}
  }

  const state = {
    tasks: loadTasks(),
    settings: loadSettings(),
    screen: "home",        // home | capture | dashboard
    captureCategory: "work",
    justAdded: [],          // ids added during the current capture visit, newest first
    view: "today",          // today | upcoming | all | completed
    filter: "all",          // all | work | personal | home | other
    editingId: null,
  };

  /* ---------------------------------------------------------------- */
  /* Date helpers                                                       */
  /* ---------------------------------------------------------------- */
  function nowISO() { return new Date().toISOString(); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function addMonths(d, n) { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; }
  function daysBetween(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / 86400000); }

  const WEEKDAYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];

  function formatDueLabel(iso) {
    if (!iso) return null;
    const d = new Date(iso);
    const today = startOfDay(new Date());
    const diff = daysBetween(today, d);
    const hasTime = d.getHours() !== 0 || d.getMinutes() !== 0;
    const timeStr = hasTime ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
    let dayStr;
    if (diff === 0) dayStr = "Today";
    else if (diff === 1) dayStr = "Tomorrow";
    else if (diff === -1) dayStr = "Yesterday";
    else if (diff < 0) dayStr = Math.abs(diff) + "d overdue";
    else if (diff < 7) dayStr = d.toLocaleDateString([], { weekday: "short" });
    else dayStr = d.toLocaleDateString([], { month: "short", day: "numeric" });
    return timeStr ? dayStr + " · " + timeStr : dayStr;
  }

  function formatAddedTs(iso) {
    const d = new Date(iso);
    const today = startOfDay(new Date());
    const diff = daysBetween(today, d);
    const timeStr = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    if (diff === 0) return "Added today · " + timeStr;
    if (diff === -1) return "Added yesterday · " + timeStr;
    return "Added " + d.toLocaleDateString([], { month: "short", day: "numeric" }) + " · " + timeStr;
  }

  /* ---------------------------------------------------------------- */
  /* Quick-add natural language parsing                                */
  /* ---------------------------------------------------------------- */
  function parseQuickAdd(raw) {
    let text = raw;
    let dueAt = null;
    let priority = "medium";
    let repeat = null;
    const tags = [];

    text = text.replace(/#(\w+)/g, (m, tag) => { tags.push(tag.toLowerCase()); return ""; });

    if (/\b(urgent|asap|important)\b/i.test(text) || /!{2,}/.test(text)) {
      priority = "high";
      text = text.replace(/\b(urgent|asap|important)\b/gi, "").replace(/!{2,}/g, "");
    } else if (/!/.test(text)) {
      priority = "high";
      text = text.replace(/!/g, "");
    } else if (/\blow priority\b/i.test(text)) {
      priority = "low";
      text = text.replace(/\blow priority\b/gi, "");
    }

    if (/\bevery\s*day\b|\bdaily\b/i.test(text)) { repeat = "daily"; text = text.replace(/\bevery\s*day\b|\bdaily\b/gi, ""); }
    else if (/\bevery\s*week\b|\bweekly\b/i.test(text)) { repeat = "weekly"; text = text.replace(/\bevery\s*week\b|\bweekly\b/gi, ""); }
    else if (/\bevery\s*month\b|\bmonthly\b/i.test(text)) { repeat = "monthly"; text = text.replace(/\bevery\s*month\b|\bmonthly\b/gi, ""); }

    let hour = null, minute = 0;
    let m = text.match(/\bat\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i) ||
            text.match(/\b(\d{1,2}):(\d{2})\s*(am|pm)?\b/i) ||
            text.match(/\b(\d{1,2})\s*(am|pm)\b/i);
    if (m) {
      hour = parseInt(m[1], 10);
      minute = m[2] && /^\d+$/.test(m[2]) ? parseInt(m[2], 10) : 0;
      const ampm = (m[3] || m[2] || "").toLowerCase();
      if (ampm === "pm" && hour < 12) hour += 12;
      if (ampm === "am" && hour === 12) hour = 0;
      if (!ampm && hour <= 7) hour += 12; // heuristic: "at 3" probably means afternoon
      text = text.replace(m[0], "");
    }

    let baseDate = null;

    if (/\btoday\b/i.test(text)) {
      baseDate = new Date();
      text = text.replace(/\btoday\b/gi, "");
    } else if (/\btonight\b/i.test(text)) {
      baseDate = new Date();
      if (hour === null) { hour = 20; minute = 0; }
      text = text.replace(/\btonight\b/gi, "");
    } else if (/\btomorrow\b|\btmrw\b/i.test(text)) {
      baseDate = addDays(new Date(), 1);
      text = text.replace(/\btomorrow\b|\btmrw\b/gi, "");
    } else {
      const inMatch = text.match(/\bin\s+(\d+)\s*(day|days|week|weeks|month|months)\b/i);
      if (inMatch) {
        const n = parseInt(inMatch[1], 10);
        const unit = inMatch[2].toLowerCase();
        baseDate = unit.startsWith("day") ? addDays(new Date(), n)
                 : unit.startsWith("week") ? addDays(new Date(), n * 7)
                 : addMonths(new Date(), n);
        text = text.replace(inMatch[0], "");
      } else {
        for (let i = 0; i < WEEKDAYS.length; i++) {
          const full = WEEKDAYS[i];
          const abbr = full.slice(0, 3);
          const re = new RegExp("\\b(next\\s+)?(" + full + "|" + abbr + ")\\b", "i");
          const wm = text.match(re);
          if (wm) {
            const today = new Date();
            const todayDow = today.getDay();
            let delta = (i - todayDow + 7) % 7;
            if (delta === 0 || wm[1]) delta = delta === 0 ? 7 : delta;
            baseDate = addDays(today, delta);
            text = text.replace(wm[0], "");
            break;
          }
        }
      }
    }
    text = text.replace(/\bnext\b/gi, "");

    if (baseDate) {
      const d = startOfDay(baseDate);
      if (hour !== null) { d.setHours(hour, minute, 0, 0); }
      dueAt = d.toISOString();
    } else if (hour !== null) {
      const d = new Date();
      d.setHours(hour, minute, 0, 0);
      if (d < new Date()) d.setDate(d.getDate() + 1);
      dueAt = d.toISOString();
    }

    text = text.replace(/\s{2,}/g, " ").trim();
    text = text.replace(/^[\s,.-]+|[\s,.-]+$/g, "");

    return { text: text || raw.trim(), dueAt, priority, repeat, tags };
  }

  /* ---------------------------------------------------------------- */
  /* Task CRUD                                                         */
  /* ---------------------------------------------------------------- */
  function addTask({ text, category, dueAt, priority, repeat, tags }) {
    const t = {
      id: uid(),
      text: text,
      category: category,
      priority: priority || "medium",
      dueAt: dueAt || null,
      tags: tags || [],
      repeat: repeat || null,
      addedAt: nowISO(),
      lastTouchedAt: nowISO(),
      completedAt: null,
      snoozedUntil: null,
    };
    state.tasks.unshift(t);
    saveTasks();
    return t;
  }

  function touch(t) { t.lastTouchedAt = nowISO(); }

  function completeTask(id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    if (t.completedAt) {
      t.completedAt = null;
      touch(t);
    } else {
      t.completedAt = nowISO();
      touch(t);
      if (t.repeat) {
        const base = t.dueAt ? new Date(t.dueAt) : new Date();
        let next;
        if (t.repeat === "daily") next = addDays(base, 1);
        else if (t.repeat === "weekly") next = addDays(base, 7);
        else next = addMonths(base, 1);
        addTask({ text: t.text, category: t.category, dueAt: next.toISOString(), priority: t.priority, repeat: t.repeat, tags: t.tags });
      }
    }
    saveTasks();
    renderCurrentScreen();
  }

  function deleteTask(id) {
    state.tasks = state.tasks.filter(x => x.id !== id);
    state.justAdded = state.justAdded.filter(x => x !== id);
    saveTasks();
    renderCurrentScreen();
  }

  function snoozeTask(id, days) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    const base = t.dueAt ? startOfDay(new Date(t.dueAt)) : startOfDay(new Date());
    const next = addDays(new Date() > new Date(t.dueAt || 0) ? new Date() : base, days);
    t.dueAt = startOfDay(next).toISOString();
    touch(t);
    saveTasks();
    renderCurrentScreen();
    showToast("Snoozed to " + formatDueLabel(t.dueAt));
  }

  function updateTask(id, patch) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    Object.assign(t, patch);
    touch(t);
    saveTasks();
    renderCurrentScreen();
  }

  /* ---------------------------------------------------------------- */
  /* Derived                                                            */
  /* ---------------------------------------------------------------- */
  function isStale(t) {
    if (t.completedAt) return false;
    const days = daysBetween(new Date(t.lastTouchedAt), new Date());
    return days >= (state.settings.staleDays || 5);
  }
  function isOverdue(t) {
    if (t.completedAt || !t.dueAt) return false;
    return new Date(t.dueAt) < startOfDay(new Date());
  }
  function isDueToday(t) {
    if (!t.dueAt) return false;
    return daysBetween(startOfDay(new Date()), new Date(t.dueAt)) === 0;
  }
  function passesFilter(t) { return state.filter === "all" || t.category === state.filter; }
  function openCountFor(cat) { return state.tasks.filter(t => !t.completedAt && t.category === cat).length; }
  function totalOpenCount() { return state.tasks.filter(t => !t.completedAt).length; }

  function computeStats() {
    const today = startOfDay(new Date());
    const weekAgo = addDays(today, -6);
    const open = state.tasks.filter(t => !t.completedAt);
    const addedToday = state.tasks.filter(t => daysBetween(today, new Date(t.addedAt)) === 0).length;
    const addedWeek = state.tasks.filter(t => new Date(t.addedAt) >= weekAgo).length;
    const completedWeek = state.tasks.filter(t => t.completedAt && new Date(t.completedAt) >= weekAgo).length;
    const overdue = open.filter(isOverdue).length;
    return { addedToday, addedWeek, completedWeek, overdue };
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* ================================================================ */
  /* Screen router                                                      */
  /* ================================================================ */
  const screens = {
    home: document.getElementById("homeScreen"),
    capture: document.getElementById("captureScreen"),
    dashboard: document.getElementById("dashboardScreen"),
  };

  function goHome() {
    state.screen = "home";
    state.justAdded = [];
    show();
  }
  function goCapture(category) {
    state.screen = "capture";
    state.captureCategory = category;
    state.justAdded = [];
    show();
    setTimeout(() => { const el = document.getElementById("captureInput"); if (el) el.focus(); }, 30);
  }
  function goDashboard(filterCategory) {
    state.screen = "dashboard";
    if (filterCategory) state.filter = filterCategory;
    show();
  }

  function show() {
    Object.keys(screens).forEach(k => screens[k].classList.toggle("hidden", state.screen !== k));
    renderCurrentScreen();
  }
  function renderCurrentScreen() {
    if (state.screen === "home") renderHome();
    else if (state.screen === "capture") renderCapture();
    else if (state.screen === "dashboard") renderDashboard();
  }

  /* ================================================================ */
  /* Home screen                                                        */
  /* ================================================================ */
  const tileGrid = document.getElementById("tileGrid");
  const homeOpenCount = document.getElementById("homeOpenCount");

  function renderHome() {
    tileGrid.innerHTML = CATEGORY_ORDER.map(cat => {
      const meta = CATEGORY_META[cat];
      const count = openCountFor(cat);
      const wide = WIDE_TILES.includes(cat) ? " wide" : "";
      return `
        <div class="tile cat-${cat}${wide}" data-cat="${cat}" role="button" tabindex="0" aria-label="Add ${meta.label} item">
          ${count ? `<span class="tile-badge">${count}</span>` : ""}
          <span class="tile-icon">${meta.icon}</span>
          <span class="tile-label">${meta.label}</span>
        </div>`;
    }).join("");
    tileGrid.querySelectorAll(".tile").forEach(el => {
      el.addEventListener("click", () => goCapture(el.dataset.cat));
      el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goCapture(el.dataset.cat); } });
    });
    homeOpenCount.textContent = totalOpenCount();
  }

  document.getElementById("btnHomeSettings").addEventListener("click", openSettingsSheet);
  document.getElementById("btnGoDashboard").addEventListener("click", () => goDashboard("all"));

  /* ================================================================ */
  /* Capture screen                                                     */
  /* ================================================================ */
  const captureCatChip = document.getElementById("captureCatChip");
  const captureInput = document.getElementById("captureInput");
  const captureSendBtn = document.getElementById("captureSendBtn");
  const captureMicBtn = document.getElementById("captureMicBtn");
  const captureParseHint = document.getElementById("captureParseHint");
  const justAddedWrap = document.getElementById("justAddedWrap");

  function renderCapture() {
    const meta = CATEGORY_META[state.captureCategory];
    captureCatChip.className = "capture-cat-chip cat-" + state.captureCategory;
    captureCatChip.textContent = meta.icon + " " + meta.label;
    captureInput.value = "";
    updateCaptureHint();
    renderJustAdded();
  }

  function updateCaptureHint() {
    const raw = captureInput.value;
    captureSendBtn.disabled = !raw.trim();
    if (!raw.trim()) { captureParseHint.innerHTML = "&nbsp;"; return; }
    const parsed = parseQuickAdd(raw);
    const bits = [];
    if (parsed.dueAt) bits.push("📅 <b>" + formatDueLabel(parsed.dueAt) + "</b>");
    if (parsed.priority === "high") bits.push("🔥 <b>High priority</b>");
    if (parsed.repeat) bits.push("🔁 <b>" + parsed.repeat + "</b>");
    if (parsed.tags.length) bits.push(parsed.tags.map(t => "#" + t).join(" "));
    captureParseHint.innerHTML = bits.length ? bits.join(" &nbsp;·&nbsp; ") : "&nbsp;";
  }
  captureInput.addEventListener("input", updateCaptureHint);
  captureInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submitCapture(); });
  captureSendBtn.addEventListener("click", submitCapture);

  function submitCapture() {
    const raw = captureInput.value.trim();
    if (!raw) return;
    const parsed = parseQuickAdd(raw);
    const t = addTask({ text: parsed.text, category: state.captureCategory, dueAt: parsed.dueAt, priority: parsed.priority, repeat: parsed.repeat, tags: parsed.tags });
    state.justAdded.unshift(t.id);
    captureInput.value = "";
    updateCaptureHint();
    renderJustAdded();
    captureInput.focus();
  }

  function renderJustAdded() {
    const items = state.justAdded.map(id => state.tasks.find(t => t.id === id)).filter(Boolean);
    if (!items.length) {
      justAddedWrap.innerHTML = `<div class="capture-empty">Nothing added yet this round — type above and hit ➜, or tap 🎤 to speak it.</div>`;
      return;
    }
    justAddedWrap.innerHTML = `<div class="just-added-label">Just added</div>` + items.map(t => `
      <div class="added-row" data-id="${t.id}">
        <span class="ok">✓</span>
        <div class="txt">${escapeHtml(t.text)}${t.dueAt ? ` <span class="meta">· ${formatDueLabel(t.dueAt)}</span>` : ""}</div>
        <button class="undo" data-undo="${t.id}" title="Remove">✕</button>
      </div>`).join("");
    justAddedWrap.querySelectorAll("[data-undo]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.undo;
        state.justAdded = state.justAdded.filter(x => x !== id);
        deleteTask(id);
      });
    });
  }

  document.getElementById("btnCaptureBack").addEventListener("click", goHome);
  document.getElementById("btnCaptureDone").addEventListener("click", goHome);
  document.getElementById("btnCaptureViewList").addEventListener("click", () => goDashboard(state.captureCategory));

  /* ---------------------------------------------------------------- */
  /* Voice input (shared recognizer, used by the Capture screen)       */
  /* ---------------------------------------------------------------- */
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  let listening = false;

  if (!SpeechRecognition) {
    captureMicBtn.style.display = "none";
  } else {
    recognizer = new SpeechRecognition();
    recognizer.continuous = false;
    recognizer.interimResults = true;
    recognizer.lang = navigator.language || "en-US";

    recognizer.onstart = () => { listening = true; captureMicBtn.classList.add("listening"); };
    recognizer.onend = () => { listening = false; captureMicBtn.classList.remove("listening"); };
    recognizer.onerror = () => { listening = false; captureMicBtn.classList.remove("listening"); };
    recognizer.onresult = (event) => {
      let transcript = "";
      for (let i = 0; i < event.results.length; i++) transcript += event.results[i][0].transcript;
      captureInput.value = transcript;
      updateCaptureHint();
    };

    captureMicBtn.addEventListener("click", () => {
      if (listening) { recognizer.stop(); return; }
      try { recognizer.start(); } catch (e) { /* already started */ }
    });
  }

  /* ================================================================ */
  /* Dashboard screen                                                   */
  /* ================================================================ */
  const statsRow = document.getElementById("statsRow");
  const tabsRow = document.getElementById("tabsRow");
  const filtersRow = document.getElementById("filtersRow");
  const mainList = document.getElementById("mainList");

  const TABS = [
    { id: "today", label: "Today" },
    { id: "upcoming", label: "Upcoming" },
    { id: "all", label: "All" },
    { id: "completed", label: "Done" },
  ];

  function tabCount(id) {
    const open = state.tasks.filter(t => !t.completedAt && passesFilter(t));
    if (id === "today") return open.filter(t => isOverdue(t) || isDueToday(t)).length;
    if (id === "upcoming") return open.filter(t => t.dueAt && !isOverdue(t) && !isDueToday(t)).length;
    if (id === "all") return open.length;
    if (id === "completed") return state.tasks.filter(t => t.completedAt && passesFilter(t)).length;
    return 0;
  }

  function renderStats() {
    const s = computeStats();
    statsRow.innerHTML = [
      { n: s.addedToday, l: "Added today" },
      { n: s.addedWeek, l: "Added this wk" },
      { n: s.completedWeek, l: "Done this wk" },
      { n: s.overdue, l: "Overdue" },
    ].map(x => `<div class="stat"><div class="n" style="${x.l==='Overdue' && x.n>0 ? 'color:var(--danger)' : ''}">${x.n}</div><div class="l">${x.l}</div></div>`).join("");
  }

  function renderTabs() {
    tabsRow.innerHTML = TABS.map(t => {
      const c = tabCount(t.id);
      return `<div class="tab ${state.view === t.id ? "active" : ""}" data-tab="${t.id}" role="button" tabindex="0">${t.label}${c ? `<span class="badge">${c}</span>` : ""}</div>`;
    }).join("");
    tabsRow.querySelectorAll(".tab").forEach(el => {
      el.addEventListener("click", () => { state.view = el.dataset.tab; renderDashboard(); });
    });
  }

  function renderFilters() {
    const opts = [["all", "All"]].concat(CATEGORY_ORDER.map(c => [c, CATEGORY_META[c].icon + " " + CATEGORY_META[c].label]));
    filtersRow.innerHTML = opts.map(([id, label]) =>
      `<div class="chip ${state.filter === id ? "active-" + id : ""}" data-filter="${id}" role="button" tabindex="0">${label}</div>`
    ).join("");
    filtersRow.querySelectorAll(".chip").forEach(el => {
      el.addEventListener("click", () => { state.filter = el.dataset.filter; renderDashboard(); });
    });
  }

  function cardHtml(t) {
    const overdue = isOverdue(t);
    const dueToday = isDueToday(t);
    const stale = isStale(t);
    const meta = CATEGORY_META[t.category] || CATEGORY_META.other;
    const pills = [];
    pills.push(`<span class="pill ${t.category}">${meta.icon} ${meta.label}</span>`);
    if (t.dueAt) {
      const cls = overdue ? "overdue-text" : dueToday ? "today-text" : "";
      pills.push(`<span class="pill due ${cls}">📅 ${formatDueLabel(t.dueAt)}</span>`);
    }
    if (t.priority === "high") pills.push(`<span class="pill priority-high">🔥 High</span>`);
    if (t.repeat) pills.push(`<span class="pill repeat">🔁 ${t.repeat}</span>`);
    if (stale && !t.completedAt) pills.push(`<span class="pill stale">⏳ Stuck ${daysBetween(new Date(t.lastTouchedAt), new Date())}d</span>`);
    (t.tags || []).forEach(tag => pills.push(`<span class="pill tag">#${tag}</span>`));

    return `
      <div class="card ${t.completedAt ? "done" : ""} ${overdue ? "overdue" : ""} ${stale && !t.completedAt ? "stale" : ""}" data-id="${t.id}">
        <button class="check" data-action="complete" aria-label="Complete">${t.completedAt ? "✓" : ""}</button>
        <div class="card-body">
          <div class="card-text">${escapeHtml(t.text)}</div>
          <div class="card-meta">${pills.join("")}</div>
          <div class="added-ts">${formatAddedTs(t.addedAt)}${t.completedAt ? " · Completed " + formatAddedTs(t.completedAt).replace("Added", "") : ""}</div>
        </div>
        <div class="card-actions">
          ${!t.completedAt ? `<button class="mini-btn" data-action="snooze" title="Snooze 1 day">💤</button>` : ""}
          <button class="mini-btn" data-action="edit" title="Edit">✏️</button>
          <button class="mini-btn" data-action="delete" title="Delete">🗑️</button>
        </div>
      </div>`;
  }

  function emptyHtml(icon, title, sub) {
    return `<div class="empty"><span class="big">${icon}</span><div><b>${title}</b></div><div>${sub || ""}</div></div>`;
  }

  function renderList() {
    const openAll = state.tasks.filter(t => !t.completedAt && passesFilter(t));
    let html = "";

    if (state.view === "today") {
      const overdue = openAll.filter(isOverdue).sort((a,b) => new Date(a.dueAt) - new Date(b.dueAt));
      const today = openAll.filter(t => isDueToday(t)).sort((a,b) => new Date(a.dueAt) - new Date(b.dueAt));
      if (!overdue.length && !today.length) {
        html = emptyHtml("🌤️", "Nothing due today", "Add something from the home screen, or check Upcoming.");
      } else {
        if (overdue.length) html += `<div class="section-label">Overdue</div>` + overdue.map(cardHtml).join("");
        if (today.length) html += `<div class="section-label">Today</div>` + today.map(cardHtml).join("");
      }
    } else if (state.view === "upcoming") {
      const upcoming = openAll.filter(t => t.dueAt && !isOverdue(t) && !isDueToday(t)).sort((a,b) => new Date(a.dueAt) - new Date(b.dueAt));
      const noDate = openAll.filter(t => !t.dueAt).sort((a,b) => new Date(b.addedAt) - new Date(a.addedAt));
      if (!upcoming.length && !noDate.length) {
        html = emptyHtml("📭", "Nothing upcoming", "Everything's either done or due today.");
      } else {
        if (upcoming.length) html += `<div class="section-label">Scheduled</div>` + upcoming.map(cardHtml).join("");
        if (noDate.length) html += `<div class="section-label">No date</div>` + noDate.map(cardHtml).join("");
      }
    } else if (state.view === "all") {
      const sorted = openAll.slice().sort((a,b) => new Date(b.addedAt) - new Date(a.addedAt));
      if (!sorted.length) {
        html = emptyHtml("📥", "Inbox is empty", "Everything you add lands here first, newest on top.");
      } else {
        html = `<div class="section-label">All open · newest added first</div>` + sorted.map(cardHtml).join("");
      }
    } else if (state.view === "completed") {
      const done = state.tasks.filter(t => t.completedAt && passesFilter(t)).sort((a,b) => new Date(b.completedAt) - new Date(a.completedAt));
      if (!done.length) {
        html = emptyHtml("🏁", "Nothing completed yet", "Finished tasks show up here.");
      } else {
        html = `<div class="section-label">Completed · most recent first</div>` + done.map(cardHtml).join("");
      }
    }
    mainList.innerHTML = html;

    mainList.querySelectorAll(".card").forEach(card => {
      const id = card.dataset.id;
      card.querySelector('[data-action="complete"]').addEventListener("click", (e) => { e.stopPropagation(); completeTask(id); });
      const snoozeBtn = card.querySelector('[data-action="snooze"]');
      if (snoozeBtn) snoozeBtn.addEventListener("click", (e) => { e.stopPropagation(); snoozeTask(id, 1); });
      card.querySelector('[data-action="edit"]').addEventListener("click", (e) => { e.stopPropagation(); openEditSheet(id); });
      card.querySelector('[data-action="delete"]').addEventListener("click", (e) => {
        e.stopPropagation();
        if (confirm("Delete this task?")) deleteTask(id);
      });
    });
  }

  function renderDashboard() {
    renderStats();
    renderTabs();
    renderFilters();
    renderList();
  }

  document.getElementById("btnDashHome").addEventListener("click", goHome);
  document.getElementById("btnSettings").addEventListener("click", openSettingsSheet);
  document.getElementById("btnFabAdd").addEventListener("click", goHome);

  /* ---------------------------------------------------------------- */
  /* Edit sheet                                                         */
  /* ---------------------------------------------------------------- */
  const modalRoot = document.getElementById("modalRoot");

  function toLocalInputValue(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function openEditSheet(id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    state.editingId = id;
    modalRoot.innerHTML = `
      <div class="sheet-backdrop" id="editBackdrop">
        <div class="sheet">
          <button class="icon-btn close-x" id="editClose">✕</button>
          <h2>Edit task</h2>
          <div class="sheet-row">
            <label>Text</label>
            <textarea id="editText" rows="2">${escapeHtml(t.text)}</textarea>
          </div>
          <div class="sheet-row">
            <label>Category</label>
            <div class="segmented" id="editCategory">
              ${CATEGORY_ORDER.map(c => `<button data-v="${c}" class="${t.category === c ? "on" : ""}">${CATEGORY_META[c].icon} ${CATEGORY_META[c].label}</button>`).join("")}
            </div>
          </div>
          <div class="sheet-row">
            <label>Priority</label>
            <div class="segmented" id="editPriority">
              <button data-v="low" class="${t.priority === "low" ? "on" : ""}">Low</button>
              <button data-v="medium" class="${t.priority === "medium" ? "on" : ""}">Medium</button>
              <button data-v="high" class="${t.priority === "high" ? "on" : ""}">High</button>
            </div>
          </div>
          <div class="sheet-row">
            <label>Due date & time</label>
            <input type="datetime-local" id="editDue" value="${toLocalInputValue(t.dueAt)}" />
          </div>
          <div class="sheet-row">
            <label>Repeat</label>
            <select id="editRepeat">
              <option value="" ${!t.repeat ? "selected" : ""}>Doesn't repeat</option>
              <option value="daily" ${t.repeat === "daily" ? "selected" : ""}>Daily</option>
              <option value="weekly" ${t.repeat === "weekly" ? "selected" : ""}>Weekly</option>
              <option value="monthly" ${t.repeat === "monthly" ? "selected" : ""}>Monthly</option>
            </select>
          </div>
          <div class="sheet-actions">
            <button class="btn danger-outline" id="editDelete">Delete</button>
            <button class="btn primary" id="editSave">Save</button>
          </div>
        </div>
      </div>`;

    const backdrop = document.getElementById("editBackdrop");
    let catSel = t.category, prioSel = t.priority;
    document.getElementById("editCategory").querySelectorAll("button").forEach(b => {
      b.addEventListener("click", () => {
        catSel = b.dataset.v;
        b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      });
    });
    document.getElementById("editPriority").querySelectorAll("button").forEach(b => {
      b.addEventListener("click", () => {
        prioSel = b.dataset.v;
        b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      });
    });
    document.getElementById("editClose").addEventListener("click", closeSheet);
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeSheet(); });
    document.getElementById("editDelete").addEventListener("click", () => {
      if (confirm("Delete this task?")) { deleteTask(id); closeSheet(); }
    });
    document.getElementById("editSave").addEventListener("click", () => {
      const dueVal = document.getElementById("editDue").value;
      updateTask(id, {
        text: document.getElementById("editText").value.trim() || t.text,
        category: catSel,
        priority: prioSel,
        dueAt: dueVal ? new Date(dueVal).toISOString() : null,
        repeat: document.getElementById("editRepeat").value || null,
      });
      closeSheet();
    });
  }

  function closeSheet() { modalRoot.innerHTML = ""; state.editingId = null; }

  /* ---------------------------------------------------------------- */
  /* Settings sheet                                                     */
  /* ---------------------------------------------------------------- */
  function syncStatusDot() {
    if (!state.settings.syncEnabled) return `<span class="status-dot off"></span>Off`;
    if (syncState.status === "ok") return `<span class="status-dot ok"></span>Synced`;
    if (syncState.status === "pending") return `<span class="status-dot pending"></span>Syncing…`;
    if (syncState.status === "err") return `<span class="status-dot err"></span>Failed`;
    return `<span class="status-dot off"></span>Not yet synced`;
  }

  function openSettingsSheet() {
    modalRoot.innerHTML = `
      <div class="sheet-backdrop" id="setBackdrop">
        <div class="sheet">
          <button class="icon-btn close-x" id="setClose">✕</button>
          <h2>Settings</h2>

          <div class="settings-group">
            <h3>Notifications</h3>
            <div class="settings-row">
              <div>
                <div class="label">Due-item reminders</div>
                <div class="sub">Browser notifications while the app is open</div>
              </div>
              <div class="switch ${state.settings.notifyEnabled ? "on" : ""}" id="notifySwitch" role="switch" tabindex="0" aria-checked="${state.settings.notifyEnabled}"><div class="knob"></div></div>
            </div>
          </div>

          <div class="settings-group">
            <h3>Google Sheets backup</h3>
            <div class="settings-row">
              <div>
                <div class="label">Sync enabled</div>
                <div class="sub">${syncStatusDot()}</div>
              </div>
              <div class="switch ${state.settings.syncEnabled ? "on" : ""}" id="syncSwitch" role="switch" tabindex="0" aria-checked="${state.settings.syncEnabled}"><div class="knob"></div></div>
            </div>
            <div class="sheet-row" style="margin-top:10px;">
              <label>Apps Script Web App URL</label>
              <input type="text" id="sheetsUrlInput" placeholder="https://script.google.com/macros/s/.../exec" value="${escapeHtml(state.settings.sheetsUrl || "")}" />
            </div>
            <div class="sheet-actions">
              <button class="btn ghost" id="testSyncBtn">Save & test</button>
            </div>
            <div class="sub" style="margin-top:8px;">See README for the 3-minute setup.</div>
          </div>

          <div class="settings-group">
            <h3>Data</h3>
            <div class="sheet-actions">
              <button class="btn ghost" id="exportBtn">Export JSON</button>
              <button class="btn ghost" id="importBtn">Import JSON</button>
            </div>
            <input type="file" id="importFile" accept="application/json" class="hidden" />
          </div>

          <div class="settings-group">
            <h3>About</h3>
            <div class="sub">${state.tasks.length} tasks stored on this device (${totalOpenCount()} open). "Stuck" flag triggers after ${state.settings.staleDays} days untouched.</div>
          </div>
        </div>
      </div>`;

    const backdrop = document.getElementById("setBackdrop");
    document.getElementById("setClose").addEventListener("click", closeSheet);
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeSheet(); });

    document.getElementById("notifySwitch").addEventListener("click", async () => {
      if (!state.settings.notifyEnabled) {
        const perm = await requestNotifyPermission();
        state.settings.notifyEnabled = perm === "granted";
        if (perm !== "granted") showToast("Notifications blocked in browser settings");
      } else {
        state.settings.notifyEnabled = false;
      }
      saveSettings();
      openSettingsSheet();
    });

    document.getElementById("syncSwitch").addEventListener("click", () => {
      state.settings.syncEnabled = !state.settings.syncEnabled;
      saveSettings();
      if (state.settings.syncEnabled) scheduleSync();
      openSettingsSheet();
    });

    document.getElementById("testSyncBtn").addEventListener("click", () => {
      state.settings.sheetsUrl = document.getElementById("sheetsUrlInput").value.trim();
      state.settings.syncEnabled = !!state.settings.sheetsUrl;
      saveSettings();
      runSync(true);
      openSettingsSheet();
    });

    document.getElementById("exportBtn").addEventListener("click", exportJson);
    document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
    document.getElementById("importFile").addEventListener("change", importJson);
  }

  /* ---------------------------------------------------------------- */
  /* Export / Import                                                    */
  /* ---------------------------------------------------------------- */
  function exportJson() {
    const data = { tasks: state.tasks, settings: { staleDays: state.settings.staleDays }, exportedAt: nowISO() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "organiser-backup-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast("Exported backup");
  }

  function importJson(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.tasks)) throw new Error("bad file");
        if (confirm(`Import ${data.tasks.length} tasks? This replaces everything currently stored.`)) {
          state.tasks = data.tasks;
          saveTasks();
          closeSheet();
          renderCurrentScreen();
          showToast("Import complete");
        }
      } catch (err) {
        alert("Couldn't read that file — is it an Organiser export?");
      }
    };
    reader.readAsText(file);
  }

  /* ---------------------------------------------------------------- */
  /* Notifications                                                       */
  /* ---------------------------------------------------------------- */
  async function requestNotifyPermission() {
    if (!("Notification" in window)) return "unsupported";
    if (Notification.permission === "granted") return "granted";
    return await Notification.requestPermission();
  }

  function loadNotified() {
    try { return new Set(JSON.parse(localStorage.getItem(NOTIFIED_KEY)) || []); }
    catch (e) { return new Set(); }
  }
  function saveNotified(set) {
    try { localStorage.setItem(NOTIFIED_KEY, JSON.stringify(Array.from(set))); } catch (e) {}
  }
  let notified = loadNotified();

  function checkDueNotifications() {
    if (!state.settings.notifyEnabled || !("Notification" in window) || Notification.permission !== "granted") return;
    const now = new Date();
    state.tasks.forEach(t => {
      if (t.completedAt || !t.dueAt || notified.has(t.id)) return;
      const due = new Date(t.dueAt);
      if (due <= now) {
        try {
          new Notification("Due: " + t.text, { body: CATEGORY_META[t.category].label + " task", icon: "icons/icon-192.png" });
        } catch (e) {}
        notified.add(t.id);
        saveNotified(notified);
      }
    });
  }
  setInterval(checkDueNotifications, 60000);

  /* ---------------------------------------------------------------- */
  /* Google Sheets one-way sync                                        */
  /* ---------------------------------------------------------------- */
  const syncState = { status: "off", timer: null };

  function scheduleSync() {
    if (!state.settings.syncEnabled || !state.settings.sheetsUrl) return;
    if (syncState.timer) clearTimeout(syncState.timer);
    syncState.timer = setTimeout(() => runSync(false), 4000);
  }

  function runSync(manual) {
    if (!state.settings.sheetsUrl) { if (manual) showToast("Add a Sheets URL first"); return; }
    syncState.status = "pending";
    fetch(state.settings.sheetsUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ tasks: state.tasks, syncedAt: nowISO() }),
    }).then(() => {
      syncState.status = "ok";
      if (manual) showToast("Sheet sync connected ✓");
    }).catch(() => {
      syncState.status = "err";
      if (manual) showToast("Sync failed — check the URL");
    });
  }

  /* ---------------------------------------------------------------- */
  /* Toast                                                              */
  /* ---------------------------------------------------------------- */
  const toastEl = document.getElementById("toast");
  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  /* ---------------------------------------------------------------- */
  /* Service worker                                                     */
  /* ---------------------------------------------------------------- */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  /* ---------------------------------------------------------------- */
  /* Boot                                                                */
  /* ---------------------------------------------------------------- */
  show();
  if (state.settings.notifyEnabled && "Notification" in window && Notification.permission === "granted") {
    checkDueNotifications();
  }
})();
</script>
</body>
</html>
