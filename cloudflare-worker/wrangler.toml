# Optional: only needed if you deploy with the Wrangler CLI instead of the
# Cloudflare dashboard (see cloudflare-worker/README.md for the no-CLI path).
name = "organiser-push"
main = "worker.js"
compatibility_date = "2024-09-01"

[triggers]
crons = ["*/10 * * * *"]

[[kv_namespaces]]
binding = "PUSH_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

